<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Famicura Ring</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7f9;margin:0;color:#17212b}.w{max-width:850px;margin:auto;padding:28px 18px}.c{background:#fff;border:1px solid #dde4ea;border-radius:16px;padding:20px;margin:14px 0}button{border:0;border-radius:10px;padding:11px 15px;background:#106fd5;color:white;font-weight:700}pre{background:#0d1621;color:#e6edf3;padding:12px;border-radius:10px;overflow:auto}.ok{color:#16723b}.bad{color:#9a5710}</style></head><body><div class="w"><h1>Famicura Ring</h1><div class="c"><h2>Stav propojení</h2><div id="st">Zjišťuji…</div></div><div class="c"><h2>Ring zařízení</h2><button id="b">Načíst zařízení</button><pre id="o">Zatím nenačteno.</pre></div><div class="c"><h2>Další krok</h2><p>Po úspěšném propojení doplníme výběr kamery, WHEP/WebRTC live stream a váš Fall Analyzer.</p></div></div><script>async function s(){const j=await(await fetch('/api/status')).json(),e=document.getElementById('st');e.textContent=j.linked?'Ring účet propojen':'Ring účet zatím není propojen';e.className=j.linked?'ok':'bad'}document.getElementById('b').onclick=async()=>{const o=document.getElementById('o');o.textContent='Načítám…';try{o.textContent=JSON.stringify(await(await fetch('/api/devices')).json(),null,2)}catch(e){o.textContent=String(e)}};s()</script></body></html>
