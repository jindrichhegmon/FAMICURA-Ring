<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ring - Famicura</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7f9;margin:0}.w{max-width:520px;margin:auto;padding:32px 18px}.c{background:white;border:1px solid #dde4ea;border-radius:16px;padding:22px}label{display:block;margin-top:14px;font-weight:700}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bcc8d1;border-radius:9px;font-size:16px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#106fd5;color:white;font-weight:700}.m{margin-top:14px;padding:11px;border-radius:9px;background:#eef2f6;display:none}</style></head><body><div class="w"><div class="c"><h1>Propojit Ring s Famicura</h1><p>Pro dokončení propojení se přihlaste k soukromé testovací aplikaci.</p><form id="f"><label>E-mail</label><input id="e" type="email"><label>Heslo Famicura</label><input id="p" type="password" required><button>Dokončit propojení</button></form><div id="m" class="m"></div></div></div><script>const q=new URLSearchParams(location.search),n=q.get('nonce'),t=q.get('time'),m=document.getElementById('m');if(!n||!t){m.style.display='block';m.textContent='Chybí Ring nonce/time. Spusťte Connect z Ring znovu.'}document.getElementById('f').onsubmit=async x=>{x.preventDefault();m.style.display='block';m.textContent='Propojuji…';try{const r=await fetch('/api/link-claim',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nonce:n,time:t,email:document.getElementById('e').value,password:document.getElementById('p').value})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Chyba');m.innerHTML='Propojeno. <a href="/">Přejít na přehled</a>';document.getElementById('f').style.display='none'}catch(e){m.textContent=e.message}}</script></body></html>
