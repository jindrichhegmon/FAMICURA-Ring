<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#106fd5">
<meta name="apple-mobile-web-app-title" content="Famicura Ring">
<meta name="format-detection" content="telephone=no">
<title>Ring – Famicura</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#f5f7f9;margin:0;color:#17212b;-webkit-tap-highlight-color:transparent}
  .w{max-width:520px;margin:auto;
     padding:28px calc(16px + env(safe-area-inset-right,0px))
             calc(40px + env(safe-area-inset-bottom,0px))
             calc(16px + env(safe-area-inset-left,0px))}
  .c{background:#fff;border:1px solid #dde4ea;border-radius:16px;padding:20px}
  h1{font-size:1.35rem;margin:0 0 8px}
  p{margin:0 0 4px}
  label{display:block;margin-top:16px;font-weight:700}
  input{width:100%;padding:13px;border:1px solid #bcc8d1;border-radius:12px;
        font-size:16px;min-height:44px} /* under 16px iOS zooms on focus */
  button{width:100%;margin-top:20px;padding:14px;min-height:48px;border:0;border-radius:12px;
         background:#106fd5;color:#fff;font-weight:700;font-size:1rem;touch-action:manipulation}
  button:disabled{background:#9db4cc}
  .m{margin-top:16px;padding:12px;border-radius:12px;background:#eef2f6;display:none;
     overflow-wrap:anywhere}
  .bad{color:#9a5710;font-weight:700}
  a{color:#106fd5}
</style>
</head>
<body>
<div class="w">
  <div class="c">
    <h1>Propojit Ring s Famicura</h1>
    <p>Pro dokončení propojení se přihlaste k soukromé testovací aplikaci.</p>
    <form id="f">
      <label for="e">E-mail</label>
      <input id="e" type="email" name="email" autocomplete="email"
             inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false">
      <label for="p">Heslo Famicura</label>
      <input id="p" type="password" name="password" autocomplete="current-password" required>
      <button id="b">Dokončit propojení</button>
    </form>
    <div id="m" class="m"></div>
  </div>
</div>

<script>
const q = new URLSearchParams(location.search);
const n = q.get('nonce');
const t = q.get('time');
const m = document.getElementById('m');
const b = document.getElementById('b');

function say(html, bad) {
  m.style.display = 'block';
  m.innerHTML = bad ? `<span class="bad">${html}</span>` : html;
}

if (!n || !t) say('Chybí Ring nonce/time. Spusťte Connect z Ring znovu.', true);

// The Account Link page is static, so record that Ring actually landed here.
fetch('/api/link-seen', {
  method: 'POST',
  headers: { 'content-type': 'application/json' },
  body: JSON.stringify({ nonce: n, time: t, referrer: document.referrer })
}).catch(() => {});

document.getElementById('f').onsubmit = async (x) => {
  x.preventDefault();
  document.activeElement && document.activeElement.blur();
  b.disabled = true;
  say('Propojuji…');

  try {
    const r = await fetch('/api/link-claim', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        nonce: n, time: t,
        email: document.getElementById('e').value,
        password: document.getElementById('p').value
      })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Chyba');

    say('Propojeno. <a href="/">Přejít na přehled</a>');
    document.getElementById('f').style.display = 'none';
  } catch (e) {
    say(e.message, true);
    b.disabled = false;
  }
};
</script>
</body>
</html>
